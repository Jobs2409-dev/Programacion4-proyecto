<!-- front-web/public/templates/public/login_vecino.html -->
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VozVecinal — Acceso Vecinos</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <link rel="stylesheet" href="{% static 'css/componentes.css' %}">
</head>
<body class="body-login-admin">

    <div class="tarjeta-login">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <h1 style="color: #1e40af; font-size: 1.5rem;">🏛️ VozVecinal</h1>
            <h2 style="font-size: 1rem; color: #0f172a; margin-top: 0.5rem;">Portal del Vecino</h2>
            <p style="font-size: 0.75rem; color: #64748b;">Ingresá con tu cuenta para reportar e informarte</p>
        </div>

        <div id="alerta-error" class="alerta-error oculta"></div>

        <!-- Botón a la ruta de entrada de Allauth -->
        <div style="display: flex; justify-content: center; margin-bottom: 1.5rem;">
            <a href="http://127.0.0.1:8000/accounts/google/login/" 
               class="btn-nav-outline" 
               style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; text-decoration: none; padding: 0.6rem; color: #0f172a; border-color: #cbd5e1; font-weight: bold; cursor: pointer;">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Iniciar sesión con Google
            </a>
        </div>

        <div style="text-align: center; font-size: 0.75rem; color: #94a3b8; margin-bottom: 1rem;">O con tu cuenta local</div>

        <form id="form-vecino-login">
            <div class="campo-grupo">
                <label for="username">Usuario / Email</label>
                <input type="text" id="username" required placeholder="tu_usuario">
            </div>

            <div class="campo-grupo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" id="btn-login" class="btn-bloque">
                Ingresar
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.2rem; font-size: 0.8rem;">
            <a href="/" style="color: #64748b; text-decoration: none;">← Volver al portal público</a>
        </div>
    </div>

    <script type="module" src="{% static 'js/vecino/vecino-login.js' %}"></script>
</body>
</html>
