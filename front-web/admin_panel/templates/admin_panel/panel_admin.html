<!-- front-web/admin_panel/templates/admin_panel/panel_admin.html -->
 {% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VozVecinal — Acceso Administrativo</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body class="body-login-admin">

    <div class="tarjeta-login">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <h1 style="color: #1e40af; font-size: 1.5rem;">🏛️ VozVecinal</h1>
            <h2 style="font-size: 1rem; color: #0f172a; margin-top: 0.5rem;">Panel de Control Municipal</h2>
            <p style="font-size: 0.75rem; color: #64748b;">Acceso reservado a superusuarios/administradores</p>
        </div>

        <div id="alerta-error" class="alerta-error oculta"></div>

        <form id="form-admin-login">
            <div class="campo-grupo">
                <label for="username">Usuario Administrador</label>
                <input type="text" id="username" required placeholder="Ej: jo" autocomplete="username">
            </div>

            <div class="campo-grupo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="submit" id="btn-login" class="btn-bloque">
                Ingresar al Panel
            </button>
        </form>
    </div>

    <script type="module" src="{% static 'js/admin-login.js' %}"></script>
</body>
</html>
